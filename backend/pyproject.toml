[project]
name = "ah-memoryhub-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "pymorphy3==2.0.6",
  "pymorphy3-dicts-ru==2.4.417150.4580142",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
neo4j = ["neo4j>=5.20"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
